name: repo-map
version: 0.1.0
description: Auto-injected repo map that keeps agents from recreating existing code. Uses aider's tree-sitter engine to build a ranked map of the current repository. Supports three modes: auto (inject before every call), manual (/repo-map command), off (per-project disable).
author: Yousef Sahloul
provides_hooks:
  - pre_llm_call
provides_commands:
  - repo-map
provides_skills:
  - repo-map
